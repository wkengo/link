<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="googlebot" content="noindex, nofollow, noarchive">
  <meta name="referrer" content="no-referrer">
  <title>リンク集</title>
  <style>
    :root{--navy:#152238;--navy2:#213653;--teal:#39767a;--gold:#b78136;--bg:#eef1f4;--card:#fff;--text:#202a35;--muted:#697586;--line:#d7dde5;--shadow:0 8px 22px rgba(21,34,56,.09)}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--text);font-family:'Segoe UI','Yu Gothic UI','Meiryo',sans-serif;line-height:1.5}
    .hero{background:linear-gradient(120deg,var(--navy),var(--navy2));color:#fff;border-bottom:3px solid var(--teal)}
    .hero-inner,.wrap{max-width:1900px;margin:auto;padding-left:20px;padding-right:20px}
    .hero-inner{padding-top:16px;padding-bottom:16px}
    h1{margin:0;font-size:25px;letter-spacing:.05em;font-weight:650}
    .wrap{padding-top:18px;padding-bottom:40px}
    .toolbar{display:flex;gap:8px;align-items:center}
    .search{flex:0 1 760px;max-width:760px;position:relative}
    .search input{width:100%;height:44px;border:1px solid var(--line);border-radius:8px;background:#fff;padding:0 14px;font-size:14px;outline:none}
    .search input:focus{border-color:var(--teal);box-shadow:0 0 0 3px rgba(57,118,122,.14)}
    .clear-btn{flex:0 0 auto;min-width:72px;height:44px;padding:0 16px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--navy);font-weight:600;white-space:nowrap;cursor:pointer}
    .clear-btn:hover{background:#f8fafb}
    .type-label{margin-left:5px;color:var(--muted);font-size:13px;font-weight:650;white-space:nowrap}
    .type-filter{display:flex;gap:5px}
    .type-btn{flex:0 0 auto;min-width:58px;height:44px;padding:0 14px;border:1px solid var(--line);border-radius:8px;background:#fff;color:#667386;font-weight:650;white-space:nowrap;cursor:pointer}
    .type-btn[data-type='all']{min-width:72px}
    .type-btn.active{background:var(--teal);border-color:var(--teal);color:#fff}
    .filters{display:flex;gap:7px;flex-wrap:wrap;margin-top:13px}
    .filter-btn{border:1px solid #cbd3dd;border-radius:999px;background:#fff;color:#445164;padding:7px 12px;font-size:13px;cursor:pointer;transition:.15s}
    .filter-btn:hover{border-color:var(--teal);color:var(--teal)}
    .filter-btn.active{background:var(--navy);border-color:var(--navy);color:#fff}
    .filter-btn .count{opacity:.72;margin-left:3px}
    .result-count{margin-left:auto;padding:7px 2px;color:var(--muted);font-size:12px;white-space:nowrap}
    .recent{display:flex;align-items:center;gap:8px;min-width:0;margin:0;padding-left:12px;border-left:1px solid #c5cdd7}
    .recent[hidden]{display:none}
    .recent-title{flex:0 0 auto;font-size:11px;color:#536173;font-weight:700;letter-spacing:.04em}
    .recent-list{display:flex;gap:7px;flex-wrap:wrap}
    .recent-chip{border:1px solid #c9d2dc;border-radius:6px;background:#fff;color:#314052;padding:6px 9px;font-size:12px;cursor:pointer;max-width:170px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .recent-chip:hover{border-color:var(--teal);color:var(--teal)}
    .category-columns{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;align-items:start;margin-top:13px}
    .category-section{min-width:0;margin:0}
    .category-section h2{font-size:14px;color:#172b46;font-weight:800;margin:0 0 7px;padding:5px 10px;background:#dce5ef;border-left:5px solid var(--navy);border-radius:0 5px 5px 0;letter-spacing:.03em}
    .grid{display:grid;grid-template-columns:1fr;gap:6px}
    .category-columns.single-category{display:block;overflow-x:auto;padding-bottom:8px}
    .category-columns.single-category .category-section{width:max-content;min-width:220px}
    .category-columns.single-category .grid{display:grid;grid-template-rows:repeat(7,38px);grid-auto-flow:column;grid-auto-columns:220px;gap:6px 12px;width:max-content}
    .link-item{position:relative;min-width:0}
    .link-card{display:block;width:100%;height:38px;min-height:38px;padding:8px 34px 8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--text);text-decoration:none;text-align:left;font:inherit;cursor:pointer;box-shadow:0 1px 2px rgba(21,34,56,.03);transition:.16s}
    .link-card:hover{transform:translateY(-2px);border-color:#aeb9c7;box-shadow:var(--shadow)}
    .file-copy{border-left:4px solid var(--gold)}
    .link-title{display:block;font-size:13px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .favorite-btn{position:absolute;right:5px;top:5px;z-index:2;width:28px;height:28px;border:0;border-radius:50%;background:transparent;color:#8490a0;font-size:19px;line-height:25px;cursor:pointer}
    .favorite-btn:hover{background:#edf1f4;color:var(--gold)}
    .favorite-btn.on{color:var(--gold)}
    .empty{display:none;padding:40px 15px;text-align:center;color:var(--muted);background:#fff;border:1px dashed #bcc6d1;border-radius:8px}
    .toast{position:fixed;left:50%;bottom:28px;z-index:9999;max-width:calc(100% - 32px);transform:translate(-50%,18px);padding:12px 18px;border-radius:8px;background:var(--navy);color:#fff;box-shadow:0 10px 30px rgba(0,0,0,.25);opacity:0;pointer-events:none;transition:.18s;text-align:center;font-size:13px}
    .toast.show{opacity:1;transform:translate(-50%,0)}
    @media(max-width:1200px){.category-columns{grid-template-columns:repeat(4,minmax(0,1fr))}}
    @media(max-width:900px){.category-columns{grid-template-columns:repeat(3,minmax(0,1fr))}}
    @media(max-width:650px){.hero-inner,.wrap{padding-left:12px;padding-right:12px}.toolbar{align-items:stretch;flex-wrap:wrap}.search{flex-basis:100%;max-width:none}.clear-btn,.type-btn{height:40px}.type-label{align-self:center}.category-columns{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.category-columns.single-category .category-section{min-width:170px}.category-columns.single-category .grid{grid-auto-columns:170px}.recent{flex-basis:100%;align-items:flex-start;padding:7px 0 0;border-left:0;border-top:1px solid #c5cdd7}.recent-list{min-width:0}}
    @media(max-width:360px){.category-columns{grid-template-columns:1fr}}
    .iphone .toolbar{display:flex;flex-wrap:nowrap;align-items:center;gap:7px}
    .iphone .search{flex:1 1 auto;max-width:none;min-width:0}
    .iphone .search input{height:40px;padding-left:10px;padding-right:10px;font-size:13px}
    .iphone .clear-btn{flex:0 0 auto;min-width:62px;height:40px;padding:0 10px}
    .iphone .type-label,.iphone .type-filter,.iphone .recent{display:none!important}
  </style>
</head>
<body>
  <header class="hero"><div class="hero-inner"><h1>リンク集</h1></div></header>
  <main class="wrap">
    <div class="toolbar">
      <div class="search"><input id="q" type="search" placeholder="タイトル・URL・カテゴリ・備考から検索"></div>
      <button class="clear-btn" id="clearBtn" type="button">クリア</button>
      <span class="type-label">対象：</span>
      <div class="type-filter" aria-label="リンク種別の絞り込み">
        <button class="type-btn active" id="allTypeBtn" type="button" data-type="all">すべて</button>
        <button class="type-btn" id="webBtn" type="button" data-type="web">Web</button>
        <button class="type-btn" id="fileBtn" type="button" data-type="file">File</button>
      </div>
      <section class="recent" id="recent" hidden><div class="recent-title">最近使ったリンク</div><div class="recent-list" id="recentList"></div></section>
    </div>
    <div class="filters" id="filters">
      <span class="result-count" id="resultCount"></span>
    </div>
    <div class="category-columns" id="categoryColumns"></div>
    <div class="empty" id="empty">該当するリンクがありません。</div>
  </main>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script>
    (function(){
      'use strict';
      var CSV_URL='https://docs.google.com/spreadsheets/d/e/2PACX-1vRkxdEz7kNbto67KzIZhkosdKJL4T6VZM2JXjcx_zqIESKO-Lev2Ga7Rudw2O1mypo3HB_jhOExc29I/pub?gid=638632535&single=true&output=csv';
      var FAV_KEY='workLinksFavoritesV1',RECENT_KEY='workLinksRecentV1',activeFilter='__all__',activeType='all',toastTimer,loading=false;
      var isIPhone=/iPhone/i.test(navigator.userAgent),items=[],q=document.getElementById('q');
      if(isIPhone){document.body.classList.add('iphone');}

      function readStore(key){try{return JSON.parse(localStorage.getItem(key)||'[]');}catch(e){return [];}}
      function writeStore(key,value){try{localStorage.setItem(key,JSON.stringify(value));}catch(e){}}
      function keyOf(item){return item.dataset.url;}
      function fallbackCopy(value){var area=document.createElement('textarea');area.value=value;area.setAttribute('readonly','');area.style.position='fixed';area.style.left='-9999px';document.body.appendChild(area);area.focus();area.select();var ok=false;try{ok=document.execCommand('copy');}catch(e){}document.body.removeChild(area);return ok?Promise.resolve():Promise.reject(new Error('copy failed'));}
      function copyText(value){if(navigator.clipboard&&window.isSecureContext){return navigator.clipboard.writeText(value).catch(function(){return fallbackCopy(value);});}return fallbackCopy(value);}
      function showToast(message,duration){var el=document.getElementById('toast');clearTimeout(toastTimer);el.textContent=message;el.classList.add('show');toastTimer=setTimeout(function(){el.classList.remove('show');},duration||2200);}
      function favorites(){var stored=readStore(FAV_KEY),valid=items.map(keyOf),cleaned=stored.filter(function(key,index){return valid.indexOf(key)>=0&&stored.indexOf(key)===index;});if(cleaned.length!==stored.length){writeStore(FAV_KEY,cleaned);}return cleaned;}
      function refreshFavorites(){var f=favorites();items.forEach(function(item){var on=f.indexOf(keyOf(item))>=0,b=item.querySelector('.favorite-btn');b.classList.toggle('on',on);b.textContent=on?'★':'☆';b.title=on?'お気に入りから解除':'お気に入りに追加';b.setAttribute('aria-label',b.title);});var count=document.getElementById('favoriteCount');if(count){count.textContent='（'+f.length+'）';}}
      function toggleFavorite(item){var f=favorites(),key=keyOf(item),index=f.indexOf(key);if(index>=0){f.splice(index,1);}else{f.push(key);}writeStore(FAV_KEY,f);refreshFavorites();applyFilters();}
      function trackRecent(item){var list=readStore(RECENT_KEY),key=keyOf(item),index=list.indexOf(key);if(index>=0){list.splice(index,1);}list.unshift(key);writeStore(RECENT_KEY,list.slice(0,6));renderRecent();}
      function activateItem(item){trackRecent(item);if(item.dataset.type==='file'){copyText(item.dataset.url).then(function(){showToast('クリップボードにコピーしました。Windowsキー＋Rを押して貼り付け、Enterしてください。',2000);}).catch(function(){showToast('コピーできませんでした。スプレッドシートからパスをコピーしてください。',2500);});}else{window.open(item.dataset.url,'_blank','noopener');}}
      function renderRecent(){var area=document.getElementById('recent'),box=document.getElementById('recentList'),keys=readStore(RECENT_KEY);if(isIPhone){box.innerHTML='';area.hidden=true;return;}box.innerHTML='';keys.forEach(function(key){var item=items.find(function(x){return keyOf(x)===key;});if(!item){return;}var b=document.createElement('button');b.type='button';b.className='recent-chip';b.textContent=item.dataset.title;b.title=item.dataset.note||item.dataset.url;b.onclick=function(){activateItem(item);};box.appendChild(b);});area.hidden=!box.children.length;}
      function setFilter(value){activeFilter=value;document.querySelectorAll('.filter-btn').forEach(function(b){b.classList.toggle('active',b.dataset.filter===value);});applyFilters();}

      function applyFilters(){
        var keyword=q.value.trim().toLowerCase(),shown=0,f=favorites(),columns=document.getElementById('categoryColumns');
        var single=activeFilter!=='__all__'&&activeFilter!=='__favorites__';
        var total=items.filter(function(item){return !isIPhone||item.dataset.type!=='file';}).length;
        columns.classList.toggle('single-category',single);
        items.forEach(function(item){var text=(item.dataset.title+' '+item.dataset.url+' '+item.dataset.category+' '+item.dataset.note).toLowerCase();var categoryOk=activeFilter==='__all__'||(activeFilter==='__favorites__'?f.indexOf(keyOf(item))>=0:item.dataset.category===activeFilter);var typeOk=activeType==='all'||item.dataset.type===activeType;var deviceOk=!isIPhone||item.dataset.type!=='file';var show=categoryOk&&typeOk&&deviceOk&&text.indexOf(keyword)>=0;item.style.display=show?'':'none';if(show){shown++;}});
        document.querySelectorAll('.category-section').forEach(function(section){section.style.display=Array.from(section.querySelectorAll('.link-item')).some(function(item){return item.style.display!=='none';})?'':'none';});
        document.getElementById('resultCount').textContent='表示中：'+shown+'／'+total+'件';
        var empty=document.getElementById('empty');empty.textContent='該当するリンクがありません。';empty.style.display=shown?'none':'block';
      }

      function parseCsv(text){var rows=[],row=[],value='',quoted=false;for(var i=0;i<text.length;i++){var ch=text[i];if(quoted){if(ch==='"'&&text[i+1]==='"'){value+='"';i++;}else if(ch==='"'){quoted=false;}else{value+=ch;}}else if(ch==='"'){quoted=true;}else if(ch===','){row.push(value);value='';}else if(ch==='\n'){row.push(value);rows.push(row);row=[];value='';}else if(ch!=='\r'){value+=ch;}}if(value!==''||row.length){row.push(value);rows.push(row);}return rows;}

      function rowsToLinks(rows){
        if(!rows.length){return [];}var headers={};rows[0].forEach(function(header,index){headers[String(header||'').replace(/^\uFEFF/,'').trim()]=index;});
        if(headers['表示文字列']===undefined||headers['URL']===undefined){throw new Error('1行目に「表示文字列」と「URL」が必要です。');}
        function cell(row,name){var index=headers[name];return index===undefined||row[index]===undefined?'':String(row[index]).trim();}
        return rows.slice(1).map(function(row,index){var title=cell(row,'表示文字列'),url=cell(row,'URL'),category=cell(row,'カテゴリ')||'未分類',note=cell(row,'備考'),orderText=cell(row,'並び順'),typeText=cell(row,'種別').toLowerCase(),enabled=cell(row,'有効').toLowerCase();if(!title||!url||['false','0','無効','いいえ','no','off'].indexOf(enabled)>=0){return null;}return {title:title,url:url,category:category,note:note,order:orderText!==''&&!isNaN(Number(orderText))?Number(orderText):index+1,type:typeText==='file'||typeText==='ファイル'?'file':typeText==='web'?'web':/^https?:\/\//i.test(url)?'web':'file',row:index+2};}).filter(Boolean).sort(function(a,b){return a.order-b.order||a.row-b.row;});
      }

      function makeFilter(value,label,count){var b=document.createElement('button');b.className='filter-btn'+(activeFilter===value?' active':'');b.type='button';b.dataset.filter=value;b.appendChild(document.createTextNode(label));var span=document.createElement('span');span.className='count';if(value==='__favorites__'){span.id='favoriteCount';}span.textContent='（'+count+'）';b.appendChild(span);b.onclick=function(){setFilter(value===activeFilter&&value!=='__all__'?'__all__':value);};return b;}
      function makeItem(link){var item=document.createElement('div');item.className='link-item';item.dataset.category=link.category;item.dataset.title=link.title;item.dataset.url=link.url;item.dataset.note=link.note;item.dataset.type=link.type;var fav=document.createElement('button');fav.className='favorite-btn';fav.type='button';fav.textContent='☆';item.appendChild(fav);var card=document.createElement(link.type==='file'?'button':'a');card.className='link-card '+(link.type==='file'?'file-copy':'web-link');card.title=link.note||link.url;if(link.type==='file'){card.type='button';}else{card.href=link.url;card.target='_blank';card.rel='noopener';}var title=document.createElement('span');title.className='link-title';title.textContent=link.title;card.appendChild(title);item.appendChild(card);return item;}

      function renderLinks(links){
        var filters=document.getElementById('filters'),columns=document.getElementById('categoryColumns'),counts={},categories=[];
        links.forEach(function(link){if(!counts[link.category]){counts[link.category]=0;categories.push(link.category);}counts[link.category]++;});
        if(activeFilter!=='__all__'&&activeFilter!=='__favorites__'&&!counts[activeFilter]){activeFilter='__all__';}
        filters.innerHTML='';filters.appendChild(makeFilter('__all__','すべて',links.length));filters.appendChild(makeFilter('__favorites__','★ お気に入り',0));categories.forEach(function(category){filters.appendChild(makeFilter(category,category,counts[category]));});var result=document.createElement('span');result.className='result-count';result.id='resultCount';filters.appendChild(result);
        columns.innerHTML='';categories.forEach(function(category){var section=document.createElement('section');section.className='category-section';section.dataset.sectionCategory=category;var h2=document.createElement('h2');h2.textContent=category;var grid=document.createElement('div');grid.className='grid';links.filter(function(link){return link.category===category;}).forEach(function(link){grid.appendChild(makeItem(link));});section.appendChild(h2);section.appendChild(grid);columns.appendChild(section);});
        items=Array.from(document.querySelectorAll('.link-item'));
        items.forEach(function(item){item.querySelector('.favorite-btn').onclick=function(e){e.preventDefault();e.stopPropagation();toggleFavorite(item);};item.querySelector('.link-card').onclick=function(e){if(item.dataset.type==='file'){e.preventDefault();activateItem(item);}else{trackRecent(item);}};});
        refreshFavorites();renderRecent();applyFilters();
      }

      function showLoadError(message){items=[];document.getElementById('filters').innerHTML='<span class="result-count" id="resultCount"></span>';document.getElementById('categoryColumns').innerHTML='';var empty=document.getElementById('empty');empty.textContent=message;empty.style.display='block';}
      function loadLinks(){if(loading){return;}if(location.protocol==='file:'){showLoadError('GitHub Pages上で開いてください。');return;}loading=true;showLoadError('スプレッドシートから読み込んでいます。');fetch(CSV_URL+'&_='+Date.now(),{cache:'no-store'}).then(function(response){if(!response.ok){throw new Error('HTTP '+response.status);}return response.text();}).then(function(csv){renderLinks(rowsToLinks(parseCsv(csv)));loading=false;}).catch(function(){loading=false;showLoadError('スプレッドシートを取得できませんでした。');});}

      document.getElementById('clearBtn').onclick=function(){q.value='';activeType='all';document.querySelectorAll('.type-btn').forEach(function(b){b.classList.toggle('active',b.dataset.type==='all');});setFilter('__all__');q.focus();};
      document.querySelectorAll('.type-btn').forEach(function(b){b.onclick=function(){var value=this.dataset.type;if(value===activeType&&value!=='all'){value='all';}activeType=value;document.querySelectorAll('.type-btn').forEach(function(x){x.classList.toggle('active',x.dataset.type===activeType);});applyFilters();};});
      q.oninput=applyFilters;
      loadLinks();
      document.addEventListener('visibilitychange',function(){if(!document.hidden){loadLinks();}});
      setInterval(function(){if(!document.hidden){loadLinks();}},60000);
    })();
  </script>
</body>
</html>
