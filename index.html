<!doctype html>
<html lang="ja">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="googlebot" content="noindex, nofollow, noarchive">
  <meta name="referrer" content="no-referrer">
  <title>リンク集</title>
  <style>
    :root{--navy:#152238;--navy2:#213653;--teal:#39767a;--gold:#b78136;--bg:#eef1f4;--card:#fff;--text:#202a35;--muted:#697586;--line:#d7dde5;--danger:#9b2c2c;--shadow:0 8px 22px rgba(21,34,56,.09)}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--text);font-family:'Segoe UI','Yu Gothic UI','Meiryo',sans-serif;line-height:1.5}
    button,input{font:inherit}
    .hero{background:linear-gradient(120deg,var(--navy),var(--navy2));color:#fff;border-bottom:3px solid var(--teal)}
    .hero-inner,.wrap{max-width:1800px;margin:auto;padding-left:20px;padding-right:20px}
    .hero-inner{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:16px;padding-bottom:16px}
    h1{margin:0;font-size:25px;letter-spacing:.05em;font-weight:650}
    .sync{font-size:11px;color:#d5dde8;text-align:right}
    .wrap{padding-top:18px;padding-bottom:40px}
    .toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
    .search{flex:1 1 480px;max-width:760px}
    .search input{width:100%;height:44px;border:1px solid var(--line);border-radius:8px;background:#fff;padding:0 14px;font-size:14px;outline:none}
    .search input:focus{border-color:var(--teal);box-shadow:0 0 0 3px rgba(57,118,122,.14)}
    .btn{height:44px;padding:0 14px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--navy);font-weight:650;white-space:nowrap;cursor:pointer}
    .btn:hover{background:#f8fafb}.btn.active{background:var(--teal);border-color:var(--teal);color:#fff}.btn:disabled{opacity:.55;cursor:wait}
    .type-label{margin-left:5px;color:var(--muted);font-size:13px;font-weight:650;white-space:nowrap}
    .type-filter{display:flex;gap:5px}
    .filters{display:flex;gap:7px;flex-wrap:wrap;margin-top:13px}
    .filter-btn{border:1px solid #cbd3dd;border-radius:999px;background:#fff;color:#445164;padding:7px 12px;font-size:13px;cursor:pointer}
    .filter-btn:hover{border-color:var(--teal);color:var(--teal)}.filter-btn.active{background:var(--navy);border-color:var(--navy);color:#fff}
    .filter-btn .count{opacity:.72;margin-left:3px}.result-count{margin-left:auto;padding:7px 2px;color:var(--muted);font-size:12px;white-space:nowrap}
    .recent{display:flex;align-items:center;gap:8px;width:100%;padding-top:5px}.recent[hidden]{display:none}
    .recent-title{font-size:11px;color:#536173;font-weight:700;white-space:nowrap}.recent-list{display:flex;gap:7px;flex-wrap:wrap}
    .recent-chip{border:1px solid #c9d2dc;border-radius:6px;background:#fff;color:#314052;padding:6px 9px;font-size:12px;cursor:pointer;max-width:170px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .category-section{margin-top:13px}.category-section h2{font-size:14px;color:#172b46;font-weight:800;margin:6px 0 7px;padding:5px 10px;background:#dce5ef;border-left:5px solid var(--navy);border-radius:0 5px 5px 0}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:6px}
    .link-item{position:relative;min-width:0}.link-card{display:block;width:100%;min-height:38px;padding:8px 34px 8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--text);text-decoration:none;text-align:left;cursor:pointer;box-shadow:0 1px 2px rgba(21,34,56,.03);transition:.16s}
    .link-card:hover{transform:translateY(-2px);border-color:#aeb9c7;box-shadow:var(--shadow)}.file-copy{border-left:4px solid var(--gold)}
    .link-title{display:block;font-size:13px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .favorite-btn{position:absolute;right:5px;top:5px;z-index:2;width:28px;height:28px;border:0;border-radius:50%;background:transparent;color:#8490a0;font-size:19px;line-height:25px;cursor:pointer}.favorite-btn:hover,.favorite-btn.on{color:var(--gold)}
    .status{padding:42px 15px;text-align:center;color:var(--muted);background:#fff;border:1px dashed #bcc6d1;border-radius:8px;margin-top:16px}.status.error{color:var(--danger);border-color:#d8a0a0}
    .toast{position:fixed;left:50%;bottom:28px;z-index:9999;max-width:calc(100% - 32px);transform:translate(-50%,18px);padding:12px 18px;border-radius:8px;background:var(--navy);color:#fff;box-shadow:0 10px 30px rgba(0,0,0,.25);opacity:0;pointer-events:none;transition:.18s;text-align:center;font-size:13px}.toast.show{opacity:1;transform:translate(-50%,0)}
    @media(max-width:650px){.hero-inner,.wrap{padding-left:12px;padding-right:12px}.search{flex-basis:100%;max-width:none}.btn{height:40px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}.result-count{width:100%;margin-left:0}}
  </style>
</head>
<body>
  <header class="hero"><div class="hero-inner"><h1>リンク集</h1><div class="sync" id="syncStatus">読込中...</div></div></header>
  <main class="wrap">
    <div class="toolbar">
      <div class="search"><input id="q" type="search" placeholder="タイトル・URL・カテゴリ・備考から検索" autocomplete="off"></div>
      <button class="btn" id="clearBtn" type="button">クリア</button>
      <button class="btn" id="reloadBtn" type="button">最新に更新</button>
      <span class="type-label">対象：</span>
      <div class="type-filter" aria-label="リンク種別の絞り込み">
        <button class="btn type-btn active" type="button" data-type="all">すべて</button>
        <button class="btn type-btn" type="button" data-type="web">Web</button>
        <button class="btn type-btn" type="button" data-type="file">File</button>
      </div>
      <section class="recent" id="recent" hidden><div class="recent-title">最近使ったリンク</div><div class="recent-list" id="recentList"></div></section>
    </div>
    <div class="filters" id="filters"></div>
    <div id="content"><div class="status">スプレッドシートから読み込んでいます。</div></div>
  </main>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script>
    (function(){
      'use strict';
      var PUBLISHED_CSV_URL='https://docs.google.com/spreadsheets/d/e/2PACX-1vRkxdEz7kNbto67KzIZhkosdKJL4T6VZM2JXjcx_zqIESKO-Lev2Ga7Rudw2O1mypo3HB_jhOExc29I/pub?gid=638632535&single=true&output=csv';
      var FAV_KEY='github_link_favorites_v1';
      var RECENT_KEY='github_link_recent_v1';
      var links=[];
      var activeFilter='__all__';
      var activeType='all';
      var loading=false;
      var toastTimer;
      var q=document.getElementById('q');
      var content=document.getElementById('content');

      function readStore(key){try{return JSON.parse(localStorage.getItem(key)||'[]');}catch(e){return [];}}
      function writeStore(key,value){try{localStorage.setItem(key,JSON.stringify(value));}catch(e){}}
      function keyOf(link){return link.url;}
      function showToast(message,duration){var el=document.getElementById('toast');clearTimeout(toastTimer);el.textContent=message;el.classList.add('show');toastTimer=setTimeout(function(){el.classList.remove('show');},duration||2200);}
      function cleanStored(key){var stored=readStore(key);var valid=links.map(keyOf);var cleaned=stored.filter(function(value,index){return valid.indexOf(value)>=0&&stored.indexOf(value)===index;});if(cleaned.length!==stored.length){writeStore(key,cleaned);}return cleaned;}
      function favorites(){return cleanStored(FAV_KEY);}
      function setLoading(value){loading=value;document.getElementById('reloadBtn').disabled=value;document.getElementById('reloadBtn').textContent=value?'更新中...':'最新に更新';}

      function loadLinks(showMessage){
        if(loading){return;}
        setLoading(true);
        fetch(PUBLISHED_CSV_URL+'&_='+Date.now(),{cache:'no-store'})
          .then(function(response){if(!response.ok){throw new Error('HTTP '+response.status);}return response.text();})
          .then(function(csv){
          links=parseSheet_(parseCsv_(csv));
          setLoading(false);
          if(activeFilter!=='__all__'&&activeFilter!=='__favorites__'&&!links.some(function(link){return link.category===activeFilter;})){activeFilter='__all__';}
          document.getElementById('syncStatus').textContent='最終取得：'+new Date().toLocaleString('ja-JP');
          renderAll();
          if(showMessage){showToast('最新の表を読み込みました。');}
          })
          .catch(function(error){showLoadError(error.message||'スプレッドシートを取得できませんでした。');});
      }

      function parseSheet_(rows){
        if(!rows.length){return [];}
        var headers={};
        rows[0].forEach(function(header,index){headers[String(header||'').replace(/^\uFEFF/,'').trim()]=index;});
        if(headers['表示文字列']===undefined||headers['URL']===undefined){throw new Error('1行目に「表示文字列」と「URL」が必要です。');}
        var result=rows.slice(1).map(function(row,index){
          var title=cell_(row,headers['表示文字列']);
          var url=cell_(row,headers['URL']);
          var category=cell_(row,headers['カテゴリ'])||'未分類';
          var note=cell_(row,headers['備考']);
          var orderText=cell_(row,headers['並び順']);
          var typeText=cell_(row,headers['種別']).toLowerCase();
          var enabledText=cell_(row,headers['有効']).toLowerCase();
          if(!title||!url||['false','0','無効','いいえ','no','off'].indexOf(enabledText)>=0){return null;}
          return {title:title,url:url,category:category,note:note,order:orderText!==''&&!isNaN(Number(orderText))?Number(orderText):index+1,type:typeText==='file'||typeText==='ファイル'?'file':typeText==='web'?'web':/^https?:\/\//i.test(url)?'web':'file',rowNumber:index+2};
        }).filter(function(link){return link!==null;});
        result.sort(function(a,b){return a.order-b.order||a.rowNumber-b.rowNumber;});
        return result;
      }

      function cell_(row,index){
        if(index===undefined||row[index]===undefined||row[index]===null){return '';}
        return String(row[index]).trim();
      }

      function parseCsv_(text){
        var rows=[];var row=[];var value='';var quoted=false;
        for(var i=0;i<text.length;i++){
          var char=text[i];
          if(quoted){
            if(char==='"'&&text[i+1]==='"'){value+='"';i++;}
            else if(char==='"'){quoted=false;}
            else{value+=char;}
          }else if(char==='"'){quoted=true;}
          else if(char===','){row.push(value);value='';}
          else if(char==='\n'){row.push(value);rows.push(row);row=[];value='';}
          else if(char!=='\r'){value+=char;}
        }
        if(value!==''||row.length){row.push(value);rows.push(row);}
        return rows;
      }

      function showLoadError(message){
        setLoading(false);
        document.getElementById('syncStatus').textContent='取得失敗';
        content.innerHTML='';
        var box=document.createElement('div');box.className='status error';box.textContent='読込エラー：'+message;content.appendChild(box);
      }

      function renderAll(){renderFilters();renderContent();renderRecent();applyFilters();}
      function renderFilters(){
        var box=document.getElementById('filters');box.innerHTML='';
        var counts={};links.forEach(function(link){counts[link.category]=(counts[link.category]||0)+1;});
        addFilterButton(box,'__all__','すべて',links.length);
        addFilterButton(box,'__favorites__','★ お気に入り',favorites().length);
        Object.keys(counts).forEach(function(category){addFilterButton(box,category,category,counts[category]);});
        var result=document.createElement('span');result.className='result-count';result.id='resultCount';box.appendChild(result);
      }
      function addFilterButton(box,value,label,count){var button=document.createElement('button');button.type='button';button.className='filter-btn'+(activeFilter===value?' active':'');button.dataset.filter=value;button.appendChild(document.createTextNode(label));var span=document.createElement('span');span.className='count';span.textContent='（'+count+'）';button.appendChild(span);button.addEventListener('click',function(){activeFilter=(activeFilter===value&&value!=='__all__')?'__all__':value;renderFilters();applyFilters();});box.appendChild(button);}

      function renderContent(){
        content.innerHTML='';var categories=[];links.forEach(function(link){if(categories.indexOf(link.category)<0){categories.push(link.category);}});
        categories.forEach(function(category){var section=document.createElement('section');section.className='category-section';section.dataset.category=category;var heading=document.createElement('h2');heading.textContent=category;var grid=document.createElement('div');grid.className='grid';links.filter(function(link){return link.category===category;}).forEach(function(link){grid.appendChild(createLinkItem(link));});section.appendChild(heading);section.appendChild(grid);content.appendChild(section);});
        var empty=document.createElement('div');empty.className='status';empty.id='empty';empty.textContent=links.length?'条件に一致するリンクがありません。':'表示するリンクがありません。';content.appendChild(empty);
      }
      function createLinkItem(link){
        var item=document.createElement('div');item.className='link-item';item.dataset.url=link.url;item.dataset.category=link.category;item.dataset.type=link.type;item.dataset.search=(link.title+' '+link.url+' '+link.category+' '+link.note).toLowerCase();
        var favorite=document.createElement('button');favorite.type='button';favorite.className='favorite-btn';favorite.addEventListener('click',function(event){event.preventDefault();event.stopPropagation();toggleFavorite(link);});item.appendChild(favorite);
        var card=document.createElement(link.type==='web'?'a':'button');card.className='link-card '+(link.type==='web'?'web-link':'file-copy');card.title=link.note||link.url;if(link.type==='web'){card.href=link.url;card.target='_blank';card.rel='noopener noreferrer';card.addEventListener('click',function(){trackRecent(link);});}else{card.type='button';card.addEventListener('click',function(){activateLink(link);});}
        var title=document.createElement('span');title.className='link-title';title.textContent=link.title;card.appendChild(title);item.appendChild(card);updateFavoriteButton(item,link);return item;
      }
      function updateFavoriteButton(item,link){var on=favorites().indexOf(keyOf(link))>=0;var button=item.querySelector('.favorite-btn');button.classList.toggle('on',on);button.textContent=on?'★':'☆';button.title=on?'お気に入りから解除':'お気に入りに追加';button.setAttribute('aria-label',button.title);}
      function toggleFavorite(link){var list=favorites();var key=keyOf(link);var index=list.indexOf(key);if(index>=0){list.splice(index,1);}else{list.push(key);}writeStore(FAV_KEY,list);renderFilters();document.querySelectorAll('.link-item').forEach(function(item){var current=links.find(function(x){return x.url===item.dataset.url;});if(current){updateFavoriteButton(item,current);}});applyFilters();}
      function trackRecent(link){var list=cleanStored(RECENT_KEY);var key=keyOf(link);var index=list.indexOf(key);if(index>=0){list.splice(index,1);}list.unshift(key);writeStore(RECENT_KEY,list.slice(0,6));renderRecent();}
      function renderRecent(){var area=document.getElementById('recent');var box=document.getElementById('recentList');box.innerHTML='';cleanStored(RECENT_KEY).forEach(function(key){var link=links.find(function(item){return keyOf(item)===key;});if(!link){return;}var button=document.createElement('button');button.type='button';button.className='recent-chip';button.textContent=link.title;button.title=link.note||link.url;button.addEventListener('click',function(){activateLink(link);});box.appendChild(button);});area.hidden=!box.children.length;}
      function activateLink(link){trackRecent(link);if(link.type==='web'){window.open(link.url,'_blank','noopener');return;}copyText(link.url).then(function(){showToast('パスをコピーしました。Windowsキー＋Rで貼り付けて開けます。',2600);}).catch(function(){showToast('コピーできませんでした。表からパスをコピーしてください。',2600);});}
      function copyText(value){if(navigator.clipboard&&window.isSecureContext){return navigator.clipboard.writeText(value).catch(function(){return fallbackCopy(value);});}return fallbackCopy(value);}
      function fallbackCopy(value){return new Promise(function(resolve,reject){var area=document.createElement('textarea');area.value=value;area.setAttribute('readonly','');area.style.position='fixed';area.style.left='-9999px';document.body.appendChild(area);area.select();var ok=false;try{ok=document.execCommand('copy');}catch(e){}document.body.removeChild(area);ok?resolve():reject(new Error('copy failed'));});}
      function applyFilters(){var keyword=q.value.trim().toLowerCase();var favoriteUrls=favorites();var shown=0;document.querySelectorAll('.link-item').forEach(function(item){var categoryOk=activeFilter==='__all__'||(activeFilter==='__favorites__'?favoriteUrls.indexOf(item.dataset.url)>=0:item.dataset.category===activeFilter);var typeOk=activeType==='all'||item.dataset.type===activeType;var visible=categoryOk&&typeOk&&item.dataset.search.indexOf(keyword)>=0;item.hidden=!visible;if(visible){shown++;}});document.querySelectorAll('.category-section').forEach(function(section){section.hidden=!Array.from(section.querySelectorAll('.link-item')).some(function(item){return !item.hidden;});});var result=document.getElementById('resultCount');if(result){result.textContent='表示中：'+shown+'／'+links.length+'件';}var empty=document.getElementById('empty');if(empty){empty.style.display=shown?'none':'block';}}
      function resetFilters(){q.value='';activeFilter='__all__';activeType='all';document.querySelectorAll('.type-btn').forEach(function(button){button.classList.toggle('active',button.dataset.type==='all');});renderFilters();applyFilters();q.focus();}

      q.addEventListener('input',applyFilters);
      document.getElementById('clearBtn').addEventListener('click',resetFilters);
      document.getElementById('reloadBtn').addEventListener('click',function(){loadLinks(true);});
      document.querySelectorAll('.type-btn').forEach(function(button){button.addEventListener('click',function(){activeType=(activeType===button.dataset.type&&button.dataset.type!=='all')?'all':button.dataset.type;document.querySelectorAll('.type-btn').forEach(function(item){item.classList.toggle('active',item.dataset.type===activeType);});applyFilters();});});
      document.addEventListener('visibilitychange',function(){if(!document.hidden){loadLinks(false);}});
      setInterval(function(){if(!document.hidden){loadLinks(false);}},60000);
      loadLinks(false);
    })();
  </script>
</body>
</html>
